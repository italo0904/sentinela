<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Triagem hospitalar</h1>
        <form>
            <div class="campo">
                <label>Queixa principal</label>
                <textarea></textarea> 
            </div>    

                <div class="linha">
                    
                    <div class="campo">
                        <label>Temperatura</label>
                        <input type="text">
                    </div>

                    <div class="campo">
                        <label>Pressão ocular</label>
                        <input type="text">
                    </div>
                </div>

                <div class="linha">
                    
                    <div class="campo">
                        <label>Peso</label>
                        <input type="text">
                    </div>

                    <div class="campo">
                        <label>Altura</label>
                        <input type="text">
                    </div>
                </div>

            <div class="linha">
                    <div class="campo">
                        <label>Nível de urgência da queixa:</label>

                        <select>
                            <option>Selecione</option>
                            <option>Baixa</option>
                            <option>Média</option>
                            <option>Alta</option>
                        </select>
                    </div>
          

                <div class="campo">
                    <label>Especialidade</label>

                    <select>
                        <option>Selecione</option>
                        <option>Oftalmo-pediatria e Estrabismo</option>
                        <option>Neuroftalmologia</option>
                        <option>Plástica Ocular</option>
                        <option>Uveíte</option>
                    </select>
                </div>
            </div>
            <div class="campo">
                <label>Alergia</label>
                <textarea></textarea> 
            </div>    

       <button class="btn btn-primary w-70"><a href="../atendimento/index.html"> Salvar triagem</a></button>     
</form>
</div>
</body>
</html>
