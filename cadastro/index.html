<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    

<body>
    <!-- cabeçalho "header" -->
    <header class="topo">
        <h1>sistema hospital</h1>
        <p>módulo: atendimento médico</p>

    </header>
    <div class="container mt-4">
         <!-- dados do paciente -->

            

         <div class="card-box">

            <h3>Cadastro do paciente</h3>

            <div class="campo">
                <label>Nome completo:</label>
                <input type="text" placeholder="Digite seu nome">
            </div>
             <div class="campo">
                <label>Data de nascimento:</label>
                <input type="date">
            </div>
            <div class="campo">
                <label>Sexo:</label>
                <select>
                    <option>Selecione</option>
                    <option>Masculino</option>
                    <option>Feminino</option>
                    <option>Outros</option>
                </select>
            </div>
            <div class="campo">
                <label>CPF:</label>
                <input type="number" placeholder="000.000.000-00">
            </div>
            <div class="campo">
                <label>Telefone:</label>
                <input type="number" placeholder="(00)00000-000">
            </div>
            <div class="campo">
                <label>Telefone de emergência:</label>
                <input type="number" placeholder="(00)00000-000">
            </div>
            <div class="campo">
                <label>Email:</label>
                <input type="email" placeholder="seuemail@gmail.com">
            </div>
            <div class="campo">
                <label>Covênio</label>
                <select>
                    <option>Selecione</option>
                    <option>Unimed</option>
                    <option>Amil</option>
                    <option>Bradesco Saúde</option>
                    <option>SulAmérica</option>
                    <option>Sem convênio</option>
                </select>
            </div>
            <div class="campo">
                <label>Endereço</label>
                <input type="text" placeholder="Rua, Número e Bairro ">
            </div>
            <div class="campo">
                <label>Observações</label>
                <textarea placeholder="Observações"></textarea>
            </div>
            <div class="botoes">
                <a href="../index.html"> <button class="btn btn-primary w-100">
                        Continuar
                       </button></a>
            </div>
         </div>
    </div>
    </div>
</body>
</html>
